name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        go-version: ["1.26", "1.27"]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go-version }}

      - name: Verify formatting
        run: test -z "$(gofmt -l .)"

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -race ./...

      - name: Build
        run: go build -o /tmp/slo-calc .

      - name: Smoke-test CLI (version + help)
        run: |
          /tmp/slo-calc --version
          /tmp/slo-calc --help || true

      - name: Generate Prometheus rules from the example spec
        run: |
          /tmp/slo-calc --spec examples/slos.yaml --window 30d --output rules > /tmp/rules.yaml
          test -s /tmp/rules.yaml
          grep -q 'slo:sli_error:ratio_rate1h' /tmp/rules.yaml
          grep -q '> 0.0144' /tmp/rules.yaml

      - name: Emit spec and rules from an access log
        run: |
          /tmp/slo-calc logs --input internal/accesslog/testdata/combined.log --latency-target 300ms \
            --emit-spec /tmp/logs-spec.yaml --emit-rules /tmp/logs-rules.yaml
          /tmp/slo-calc --spec /tmp/logs-spec.yaml --output rules | diff - /tmp/logs-rules.yaml

      - name: Validate rules with promtool
        run: |
          PROM_VER=3.15.1
          PROM_SHA256=6a726885328ad9efebbf36e876ce2fb6225468a71fd1e7ce3ba666d5f4d97a84
          curl -fsSLo prometheus.tar.gz "https://github.com/prometheus/prometheus/releases/download/v${PROM_VER}/prometheus-${PROM_VER}.linux-amd64.tar.gz"
          echo "${PROM_SHA256}  prometheus.tar.gz" | sha256sum -c -
          tar xzf prometheus.tar.gz
          "./prometheus-${PROM_VER}.linux-amd64/promtool" check rules /tmp/rules.yaml /tmp/logs-rules.yaml
